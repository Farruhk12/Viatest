<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420" role="img" aria-label="Беременная женщина">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd6e8"/>
      <stop offset="1" stop-color="#dcebff"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6619f"/>
      <stop offset="1" stop-color="#ed2f87"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2307f"/>
      <stop offset="1" stop-color="#cc226f"/>
    </linearGradient>
  </defs>

  <circle cx="205" cy="225" r="170" fill="url(#bg)"/>
  <circle cx="330" cy="92" r="10" fill="#ffffff" opacity=".8"/>
  <circle cx="72" cy="150" r="6" fill="#ffffff" opacity=".8"/>
  <path d="M86 92l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#ffffff"/>
  <path d="M332 300l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#ffffff"/>

  <!-- leaves -->
  <path d="M70 360c10-60 50-90 80-96-14 30-36 70-80 96z" fill="#9fd9c9"/>
  <path d="M60 330c-6-40 12-74 36-88 0 30-10 64-36 88z" fill="#bfe8dc"/>
  <path d="M340 365c-8-50-40-78-66-86 10 28 28 62 66 86z" fill="#bfe8dc"/>

  <!-- hair bun -->
  <circle cx="170" cy="90" r="20" fill="#3b2a3f"/>
  <!-- neck -->
  <rect x="198" y="128" width="17" height="26" rx="8" fill="#efb999"/>
  <!-- head -->
  <circle cx="207" cy="104" r="32" fill="#f6c9ad"/>
  <path d="M237 104c5 3 7 7 4 10-2 2-5 2-7 1z" fill="#f6c9ad"/>
  <!-- hair -->
  <path d="M176 112c-6-36 22-56 50-46 10 4 16 12 18 20-14-6-30-6-40 4-8 8-8 22-12 34-4 10-12 8-16-12z" fill="#3b2a3f"/>
  <!-- face -->
  <path d="M222 102c3-2 7-2 9 0" fill="none" stroke="#3b2a3f" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="222" cy="116" r="5" fill="#f59ab9" opacity=".55"/>
  <path d="M228 122c3 2 6 1 8-1" fill="none" stroke="#c4566f" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="196" cy="108" r="5" fill="#efb999"/>

  <!-- dress -->
  <path d="M186 150q20-7 42 0 14 10 12 35-2 14-6 23c42 12 66 54 50 87-8 17-26 25-40 29l22 76H150l22-150c2-40 0-75 14-100z" fill="url(#dress)"/>
  <path d="M234 208c42 12 66 54 50 87" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".35"/>
  <path d="M176 238q30 8 58-30" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".55"/>

  <!-- arm resting on belly -->
  <path d="M203 164c-6 38-2 72 18 86l38 8" fill="none" stroke="url(#sleeve)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="265" cy="259" rx="12" ry="9" fill="#f6c9ad"/>

  <!-- heart -->
  <path d="M296 214c-6-8-20-4-18 7 1 7 10 12 18 18 8-6 17-11 18-18 2-11-12-15-18-7z" fill="#ffffff"/>
  <path d="M296 220c-3-4-10-2-9 3.5.5 3.5 5 6 9 9 4-3 8.5-5.5 9-9 1-5.5-6-7.5-9-3.5z" fill="#ed2f87"/>

  <!-- flowers -->
  <g transform="translate(118 362)">
    <circle cx="0" cy="-12" r="10" fill="#ffb3d1"/>
    <circle cx="11" cy="-3" r="10" fill="#ffb3d1"/>
    <circle cx="7" cy="10" r="10" fill="#ffb3d1"/>
    <circle cx="-7" cy="10" r="10" fill="#ffb3d1"/>
    <circle cx="-11" cy="-3" r="10" fill="#ffb3d1"/>
    <circle cx="0" cy="0" r="6" fill="#ffd36e"/>
  </g>
  <g transform="translate(300 360) scale(.8)">
    <circle cx="0" cy="-12" r="10" fill="#c7b6ff"/>
    <circle cx="11" cy="-3" r="10" fill="#c7b6ff"/>
    <circle cx="7" cy="10" r="10" fill="#c7b6ff"/>
    <circle cx="-7" cy="10" r="10" fill="#c7b6ff"/>
    <circle cx="-11" cy="-3" r="10" fill="#c7b6ff"/>
    <circle cx="0" cy="0" r="6" fill="#ffd36e"/>
  </g>
</svg>
